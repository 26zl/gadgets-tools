name: ci
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: flipper/flipper-feberis
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Python tests
        run: python3 -m unittest discover -v

      - name: Native date-math test
        run: c++ -std=c++17 -O2 tests/date_math_test.cpp -o /tmp/dt && /tmp/dt

      - name: Native track test
        run: c++ -std=c++17 -O2 tests/track_test.cpp -o /tmp/tk && /tmp/tk

      - name: Native format test
        run: c++ -std=c++17 -O2 tests/format_test.cpp -o /tmp/fmt && /tmp/fmt

      - name: Cache PlatformIO
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ hashFiles('flipper/flipper-feberis/platformio.ini') }}

      - name: Firmware build
        run: |
          pip install "platformio~=6.1"
          pio run
          sha256sum .pio/build/esp32dev/firmware.bin > firmware.bin.sha256
          cat firmware.bin.sha256

      - name: Publish firmware + checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware
          path: |
            flipper/flipper-feberis/.pio/build/esp32dev/firmware.bin
            flipper/flipper-feberis/firmware.bin.sha256

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: markdownlint (project READMEs)
        run: >
          npx --yes markdownlint-cli2@0.23.1
          README.md flipper/README.md flipper/flipper-feberis/README.md flipper/flipper-wifi-devboard/README.md
          galaxy-s10-nethunter/README.md m5stickc-plus2/README.md t-dongle-s3/README.md
      - name: shellcheck (project scripts)
        run: shellcheck -S warning galaxy-s10-nethunter/scripts/*.sh m5stickc-plus2/flash.sh t-dongle-s3/flash.sh
