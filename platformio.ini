[env:esp32dev]
platform = espressif32@7.0.1     ; pinned; verified by a successful local build
board = esp32dev                 ; ESP32-WROOM, matches Feberis Pro
framework = arduino
monitor_speed = 115200
lib_deps = mikalhart/TinyGPSPlus@1.1.0

; Optional fixed AP password:
; build_flags = -DFEBERIS_AP_PASS='"your-8-to-63-char-password"'
